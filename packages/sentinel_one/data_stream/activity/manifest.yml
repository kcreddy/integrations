title: Collect activity logs from SentinelOne
type: logs
streams:
  - input: cel
    migrate_from: httpjson
    title: Activity
    description: Collect activity logs from SentinelOne.
    template_path: cel.yml.hbs
    vars:
      - name: initial_interval
        type: text
        title: Initial Interval
        description: "How far back to pull the activities from SentinelOne. NOTE: Supported units for this parameter are h/m/s."
        multi: false
        required: true
        show_user: true
        default: 24h
      - name: interval
        type: text
        title: Interval
        description: "Duration between requests to the SentinelOne API. NOTE: Supported units for this parameter are h/m/s."
        default: 30s
        multi: false
        required: true
        show_user: true
      - name: batch_size
        type: integer
        title: Batch Size
        description: Batch size for the response of the SentinelOne API. The maximum supported page size value is 100.
        default: 100
        multi: false
        required: true
        show_user: false
      - name: site_ids
        type: text
        title: Site IDs
        multi: false
        required: false
        show_user: false
        description: Comma separated list of Site IDs to filter by. Example - "225494730938493804,225494730938493915".
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        default: false
        multi: false
        required: false
        show_user: false
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - sentinel_one-activity
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
