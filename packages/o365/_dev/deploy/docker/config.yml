rules:
  # Token endpoint
  - path: /test-cel-tenant-id/oauth2/v2.0/token
    methods: [POST]
    query_params:
      client_id: test-cel-client-id
      client_secret: test-cel-client-secret
      grant_type: client_credentials
      scope: https://manage.office.com/.default
    request_headers:
      Content-Type:
        - "application/x-www-form-urlencoded"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
              "access_token": "CELtoken",
              "token_type": "Bearer",
              "expires_in": 3600,
              "ext_expires_in": 3600
          }
          `}}
  # Subscribe Audit.SharePoint
  - path: /api/v1.0/test-cel-tenant-id/activity/feed/subscriptions/start
    methods: [POST]
    query_params:
      contentType: "Audit.SharePoint"
      PublisherIdentifier: test-cel-tenant-id
    request_headers:
      Authorization:
        - "Bearer CELtoken"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {{ minify_json `
          {
              "contentType": "Audit.SharePoint",
              "status": "enabled",
              "webhook": null
          }
          `}}
  # Listing page 1 — 2 blobs, NextPageUri → page 2
  - path: /api/v1.0/test-cel-tenant-id/activity/feed/subscriptions/content
    methods: [GET]
    query_params:
      contentType: "Audit.SharePoint"
      startTime: "{startTime:.*}"
      endTime: "{endTime:.*}"
      PublisherIdentifier: test-cel-tenant-id
    request_headers:
      Authorization:
        - "Bearer CELtoken"
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
          NextPageUri:
            - 'http://{{ hostname }}:{{ env "PORT" }}/api/v1.0/test-cel-tenant-id/activity/feed/subscriptions/content?contenttype=Audit.SharePoint&page=2'
        body: |-
